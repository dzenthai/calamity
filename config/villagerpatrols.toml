[Wards]
	#Enables ward banners that block Villager Patrols spawn content nearby.
	enableWardBanners = true
	#Initial delay in minutes before this mod allows natural and chunk generation spawn placement checks. Set to 0 to disable.
	# Default: 2
	# Range: > 0
	initialSpawnDelayMinutes = 2
	#Initial delay in minutes before this mod allows world events and skirmishes. Set to 0 to disable.
	# Default: 2
	# Range: > 0
	initialWorldEventAndSkirmishDelayMinutes = 2
	#Radius in blocks where the total ward banner blocks Villager Patrols spawn content.
	# Default: 96
	# Range: > 0
	wardBannerRadius = 96
