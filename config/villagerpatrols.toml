[Events]
	#Enables random world encounters such as travelers, camps, mounted groups, prisoners and trader meetings.
	enableWorldEvents = true
	#Minimum distance from the player where world events can appear.
	# Default: 16
	# Range: > 8
	worldEventMinPlayerDistance = 16
	#Maximum distance from the player where world events can appear.
	# Default: 35
	# Range: > 18
	worldEventMaxPlayerDistance = 35
	#Minimum delay in ticks before trying to spawn another world event after a failed attempt.
	# Default: 2500
	# Range: > 100
	worldEventAttemptDelayMinTicks = 2500
	#Maximum delay in ticks before trying to spawn another world event after a failed attempt.
	# Default: 3600
	# Range: > 100
	worldEventAttemptDelayMaxTicks = 3600
	#Minimum cooldown in ticks after a world event successfully spawns.
	# Default: 5200
	# Range: > 100
	worldEventSuccessCooldownMinTicks = 5200
	#Maximum cooldown in ticks after a world event successfully spawns.
	# Default: 6000
	# Range: > 100
